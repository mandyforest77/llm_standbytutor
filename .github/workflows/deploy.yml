name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main # 메인 브랜치에 push될 때 실행 (원하는 브랜치명으로 변경 가능)

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      # 1. GitHub 저장소의 소스코드를 Actions 서버로 가져옴
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Docker Hub 로그인을 위한 설정 수행
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mandyforest77
          password: ${{ secrets.MY_SECRET_TOKEN_KEY }}

      # 3. Docker 이미지를 빌드하고 Docker Hub로 Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # docker_hub_아이디/레포지토리명:태그 형식으로 저장됩니다.
          tags: mandyforest77/standbytutor:latest

          # 2. Docker Hub 로그인을 위한 설정 수행
      - name: Log in to Docker Hub Securely
        env:
          # 금고에서 꺼낸 값을 시스템이 건드리지 못하게 환경 변수에 격리합니다.
          DOCKER_SECURE_PASS: ${{ secrets.MY_SECRET_TOKEN_KEY }}
        run: |
          # 변수 왜곡 없이 정확히 문자열만 추출하여 도커 엔진에 주입합니다.
          echo "$DOCKER_SECURE_PASS" | docker login -u mandyforest77 --password-stdin


    

