name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main # 메인 브랜치에 push될 때 실행 (원하는 브랜치명으로 변경 가능)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소의 소스코드를 Actions 서버로 가져옴
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Docker Hub 로그인을 위한 설정 수행
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mandyforest77
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Docker 이미지를 빌드하고 Docker Hub로 Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # docker_hub_아이디/레포지토리명:태그 형식으로 저장됩니다.
          tags: mandyforest77/standbytutor:latest
      
      - name: Secret Check Test
        run: |
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "🚨 경고: 깃허브 금고에서 시크릿을 아예 못 가져오고 있습니다! 빈 값입니다."
          else
            echo "🍏 성공: 금고에서 값을 가져왔습니다. (보안상 화면에는 ***로 출력됩니다: ${{ secrets.DOCKER_PASSWORD }})"
          fi
